# 개발용(ADR-007·012). 운영 브로커와 원천 컨테이너 배치는 플랫폼 소유다.
# 호스트에서 보내기: docker compose up -d redpanda → uv run python -m emitter --sink kafka
# 원천을 모두 컨테이너로: docker compose --profile source up --build
#   sim(정답 로그, 끝나면 멈춤) → emitter(Kafka) · replay(out/requests/ 살펴보기)
# 토픽은 자동으로 만든다. 컨테이너끼리는 redpanda:29092, 호스트는 localhost:9092
x-source: &source
  build: .
  image: virtual-shipyard-simulator:dev
  volumes:
    - ./out:/app/out
  profiles: [source]

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 10s
      retries: 20

  sim:
    <<: *source
    command: ["python", "-m", "sim", "--seed", "0"]

  emitter:
    <<: *source
    command:
      - python
      - -m
      - emitter
      - --sink=kafka
      - --bootstrap=redpanda:29092
      - --checkpoint=out/emitter.ckpt
      - --copy-dir=out/emitted
    depends_on:
      sim:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy

  replay:
    <<: *source
    command: ["python", "-m", "emitter.replay_service", "--requests-dir=out/requests"]
    restart: unless-stopped
    depends_on:
      sim:
        condition: service_completed_successfully

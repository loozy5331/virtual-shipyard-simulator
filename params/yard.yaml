# 가상 조선소 설정. 이름과 배치는 가상이다(README 공개 출처 원칙).
# 규모는 국내 대형 조선소 한 곳(공개 자료)에 맞춘다. 출처는 docs/sources.md.
name: 서해조선
params_version: v0
epoch: "2026-11-02T08:00:00+09:00"   # 시뮬레이션 시계 0분(ADR-002)

# 연간 생산 계획. 작업장 수는 이 계획을 가동률 약 70~75%로 소화하게 정한다(tests/test_capacity.py).
annual_plan:
  deliveries: {value: 24, grade: 가정, note: 대형 조선소 연 22~24척 건조 계획(2023 보도)}
  mix:
    lng_carrier: {value: 12, grade: 가정, note: 국내 대형 조선소 수주의 큰 몫이 LNG선}
    vlcc: {value: 6, grade: 가정}
    container: {value: 6, grade: 가정}

# 인력. 직영 + 사내 협력사. 조선소 생산 인력의 대부분은 협력사다.
workforce:
  direct: {value: 9000, grade: 가정, note: 빅3 조선부문 직영 8,993~11,125명(2024 상반기 공시)}
  subcontract: {value: 20000, grade: 가정, note: 대형 조선소 사내 협력사 인력 약 1만 5천~2만 명 보도}
  annual_hours: {value: 2000, grade: 가정, note: 한 사람의 연간 근무 시간(잔업 포함)}

# count = 작업장 수(resource_id가 붙는 단위), slots = 작업장 하나에서 동시에 하는 작업 수(정반·도크 안 배 자리).
resources:
  fabrication: {prefix: FAB, count: {value: 5, grade: 가정, note: 공장 하나 하루 약 670t, 계획 물량 하루 약 2,300t}, slots: {value: 1, grade: 가정}}
  assembly: {prefix: ASM, count: {value: 6, grade: 가정}, slots: {value: 64, grade: 가정, note: 조립장 하나의 정반 수}}
  dock: {prefix: DOCK, count: {value: 5, grade: 가정, note: 빅3 도크 5~11개(2024 공시 인용 보도)}, slots: {value: 2, grade: 가정, note: 대형 도크 한 곳에서 여러 척을 함께 짓는다(보도)}}
  berth: {prefix: BERTH, count: {value: 12, grade: 가정, note: 안벽 의장 기간이 긴 LNG선이 많아 도크보다 많다}, slots: {value: 1, grade: 가정}}
  trial: {prefix: TRIAL, count: {value: 3, grade: 가정, note: 시운전 팀}, slots: {value: 1, grade: 가정}}

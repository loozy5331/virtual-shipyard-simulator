# 공정 소요 시간의 흩어짐(3단계). 평균은 ship_types.yaml의 고정 시간 그대로 두고, 여기서는 흩어짐만 정한다.
# 파일 이름 = yard.yaml의 params_version. 보정하면 v1.yaml을 새로 만든다(게이트 이후 8단계).
# 실제 시간 = 평균 × 배수, 배수는 평균 1인 로그정규 분포. cv = 표준편차 ÷ 평균. cv 0이면 고정 시간.
params_version: v0
duration:
  steel_fabrication: {dist: lognormal, cv: {value: 0.2, grade: 가정, note: 절단·가공은 기계 작업이라 덜 흩어진다}}
  block_assembly: {dist: lognormal, cv: {value: 0.3, grade: 가정, note: 용접 인력·자재에 따라 많이 흩어진다}}
  erection: {dist: lognormal, cv: {value: 0.1, grade: 가정, note: 도크 일정은 진수 날짜에 묶여 있어 덜 흩어진다}}
  quay_outfitting: {dist: lognormal, cv: {value: 0.15, grade: 가정}}
  sea_trial: {dist: lognormal, cv: {value: 0.2, grade: 가정, note: 날씨·결함 재시험}}

# 방출기 노이즈(5단계, ADR-005). 정답 로그에 섞는 지연 도착·중복·누락. 순서 어긋남은 지연의 결과.
noise:
  drop_rate: {value: 0.005, grade: 가정, note: 보내지 않은 이벤트 비율}
  duplicate_rate: {value: 0.01, grade: 가정, note: 재전송으로 한 번 더 도착하는 비율}
  retry_median_seconds: {value: 60, grade: 가정, note: 중복 사본이 원본보다 늦게 도착하는 간격의 중앙값}
  delay:
    median_seconds: {value: 5, grade: 가정, note: 보통 지연의 중앙값. 몇 초 안에 도착}
    sigma: {value: 1.0, grade: 가정, note: 보통 지연 로그정규의 σ}
    late_rate: {value: 0.03, grade: 가정, note: 늦게 도착하는 비율(통신 장애, 현장 단말 일괄 전송)}
    late_median_minutes: {value: 120, grade: 가정}
    late_sigma: {value: 1.0, grade: 가정}
    max_hours: {value: 72, grade: 가정, note: 지연 상한. 방출기 버퍼 크기를 정한다}

# 마감 집계(ADR-006). 출처 시스템마다 하루 한 번 0시 마감으로, 보낸 개체별 마지막 seq를 보낸다.
# 원천이 내는 대사의 기준이다. 대사(받은 것과 맞춰 보기)와 대사할 범위는 플랫폼이 정한다.
manifest:
  lookback_days: {value: 30, grade: 가정, note: 마감 전 이 기간 안에 이벤트를 보낸 개체만 집계에 넣는다. 원천이 상태를 들고 있는 기간}

# 설비 고장(6단계, ADR-010). 작업장(resource_id) 하나 = 설비 하나로 보고, 고장 나면 그 작업장의 작업이 멈춘다.
# 고장 간격은 지수분포(평균 mtbf_hours, 달력 시간), 수리 시간은 로그정규(중앙값·σ·상한). 시운전 팀은 사람이라 고장이 없다.
# reasons에서 고르게 하나를 고장 원인으로 낸다.
failures:
  fabrication:
    mtbf_hours: {value: 200, grade: 가정, note: 절단기·프레스. 공장 하나에 열흘에 한 번꼴}
    repair_median_hours: {value: 4, grade: 가정}
    repair_sigma: {value: 1.0, grade: 가정}
    repair_max_hours: {value: 72, grade: 가정, note: 부품 대기까지 사흘}
    reasons: [cutting_machine_failure, press_failure, conveyor_failure]
  assembly:
    mtbf_hours: {value: 400, grade: 가정, note: 조립장 천장 크레인. 멈추면 조립장 전체가 선다}
    repair_median_hours: {value: 6, grade: 가정}
    repair_sigma: {value: 1.0, grade: 가정}
    repair_max_hours: {value: 72, grade: 가정}
    reasons: [overhead_crane_failure, welding_power_failure, hydraulic_failure]
  dock:
    mtbf_hours: {value: 1000, grade: 가정, note: 골리앗 크레인. 드물지만 길다}
    repair_median_hours: {value: 12, grade: 가정}
    repair_sigma: {value: 1.0, grade: 가정}
    repair_max_hours: {value: 120, grade: 가정}
    reasons: [goliath_crane_failure, power_failure]
  berth:
    mtbf_hours: {value: 600, grade: 가정, note: 안벽 크레인}
    repair_median_hours: {value: 8, grade: 가정}
    repair_sigma: {value: 1.0, grade: 가정}
    repair_max_hours: {value: 72, grade: 가정}
    reasons: [quay_crane_failure, power_failure]

# 자재 발주·입고(7단계, ADR-011). 호선마다 자재를 발주하고, 받기 전에는 그 자재가 필요한 공정을 시작(또는 끝)하지 못한다.
# need: 필요한 공정과 시점(start = 착수 전, end = 끝내기 전). lots: 블록 공정이면 블록을 나눠 받는 횟수.
# 발주 = 계획한 필요일 - lead_days(약속 리드타임) - margin_days(여유). 계약보다 이르면 계약할 때 발주한다.
# 입고: late_rate만큼 늦고(약속일 + 로그정규 지연, 상한), 나머지는 약속일에서 0~early_max_days 일찍 온다.
# suppliers는 가상 공급사, 발주마다 고르게 하나.
materials:
  steel_plate:
    need: {process: steel_fabrication, at: start}
    lots: {value: 4, grade: 가정, note: 블록 착수 계획(약 3개월)을 넷으로 나눠 받는다}
    unit: t
    lead_days: {value: 60, grade: 가정, note: 후판 주문 → 입고}
    margin_days: {value: 14, grade: 가정}
    early_max_days: {value: 3, grade: 가정}
    late_rate: {value: 0.08, grade: 가정, note: 장기 계약 제철소. 주요 공급사 납기 준수 90% 이상을 관리 목표로 본다}
    late_median_days: {value: 5, grade: 가정}
    late_sigma: {value: 1.0, grade: 가정}
    late_max_days: {value: 45, grade: 가정}
    suppliers: [한빛제철, 동해강업, 서남철강]
  main_engine:
    need: {process: erection, at: end}
    lots: {value: 1, grade: 가정}
    unit: set
    lead_days: {value: 360, grade: 가정, note: 주기관 제작. 진수 전에 기관실에 싣는다}
    margin_days: {value: 30, grade: 가정}
    early_max_days: {value: 7, grade: 가정}
    late_rate: {value: 0.1, grade: 가정, note: 엔진 제작이 빠듯하다고 보고 다른 자재보다 높게. 공개 자료를 찾으면 출처로}
    late_median_days: {value: 21, grade: 가정, note: 늦으면 길게}
    late_sigma: {value: 1.0, grade: 가정}
    late_max_days: {value: 120, grade: 가정}
    suppliers: [서진엔진, 대한기관]
  outfitting_pipe:
    need: {process: quay_outfitting, at: start}
    lots: {value: 1, grade: 가정}
    unit: set
    lead_days: {value: 120, grade: 가정, note: 배관·밸브 한 척분}
    margin_days: {value: 14, grade: 가정}
    early_max_days: {value: 5, grade: 가정}
    late_rate: {value: 0.12, grade: 가정, note: 품목이 많아 다른 자재보다 조금 높게}
    late_median_days: {value: 7, grade: 가정}
    late_sigma: {value: 1.0, grade: 가정}
    late_max_days: {value: 60, grade: 가정}
    suppliers: [바다배관, 남도밸브]
  electrical_cable:
    need: {process: quay_outfitting, at: start}
    lots: {value: 1, grade: 가정}
    unit: set
    lead_days: {value: 90, grade: 가정, note: 전선 한 척분}
    margin_days: {value: 14, grade: 가정}
    early_max_days: {value: 5, grade: 가정}
    late_rate: {value: 0.08, grade: 가정}
    late_median_days: {value: 5, grade: 가정}
    late_sigma: {value: 1.0, grade: 가정}
    late_max_days: {value: 45, grade: 가정}
    suppliers: [한결전선, 동방케이블]

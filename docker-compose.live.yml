# 실시간 재생(ADR-013). 기본 compose 위에 겹쳐 쓴다:
#   docker compose -f docker-compose.yml -f docker-compose.live.yml --profile source up --build
# sim은 끝없이(가상 하루 = 실제 1분, 하루 앞서), emitter는 정답 로그를 따라 읽으며 같은 속도로 보낸다.
# 정답 로그가 10GB에 닿으면 sim이 그날까지 쓰고 멈춘다(실제로 1년 넘게 걸린다).
services:
  sim:
    command: ["python", "-m", "sim", "--seed", "0", "--forever", "--speed", "1440"]

  emitter:
    command:
      - python
      - -m
      - emitter
      - --sink=kafka
      - --bootstrap=redpanda:29092
      - --checkpoint=out/emitter.ckpt
      - --copy-dir=out/emitted
      - --follow
      - --speed=1440
    depends_on:
      sim:
        condition: service_started

  replay:
    depends_on:
      sim:
        condition: service_started
